name: LuvianoSkaner
options:
  bundleIdPrefix: pl.luviano
  deploymentTarget:
    iOS: "17.0"
targets:
  LuvianoSkaner:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LUVIANO Skaner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Kamera i LiDAR są potrzebne do skanowania pomieszczenia i zdjęć punktów instalacji.
        NSBluetoothAlwaysUsageDescription: Bluetooth łączy dalmierz Bosch GLM — pomiar trafia prosto do wymiaru.
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: pl.luviano.skaner
            CFBundleURLSchemes: [luvianoskaner]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.luviano.skaner
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
