name: iOS Skaner → TestFlight

# Buduje, podpisuje (podpis zarządzany przez Apple w chmurze, klucz API App Store
# Connect) i wysyła LUVIANO Skaner do TestFlight. Na iPadzie: apka TestFlight →
# Aktualizuj. Bez Sideloadly, bez 7-dniowego wygasania.
#
# Sekrety repo (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      — Key ID klucza API (App Store Connect → Users and Access → Integrations)
#   ASC_ISSUER_ID   — Issuer ID (ta sama strona, nad listą kluczy)
#   ASC_KEY_P8      — cała zawartość pliku AuthKey_XXXX.p8 (rola klucza: Admin)
#   APPLE_TEAM_ID   — Team ID (developer.apple.com → Account → Membership)
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml"]
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Sekrety ustawione?
        id: gate
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::Brak sekretów App Store Connect — pomijam TestFlight."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'

      - name: Klucz API
        if: steps.gate.outputs.ok == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: XcodeGen
        if: steps.gate.outputs.ok == 'true'
        working-directory: ios/LuvianoSkaner
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (podpis)
        if: steps.gate.outputs.ok == 'true'
        working-directory: ios/LuvianoSkaner
        run: |
          set -o pipefail
          # Numer builda rośnie z każdym uruchomieniem (TestFlight wymaga unikalnego).
          xcodebuild archive \
            -project LuvianoSkaner.xcodeproj \
            -scheme LuvianoSkaner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LuvianoSkaner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee build.log | grep -E "error:|ARCHIVE" || true
          test -d build/LuvianoSkaner.xcarchive/Products/Applications/LuvianoSkaner.app

      - name: Eksport i wysyłka do TestFlight
        if: steps.gate.outputs.ok == 'true'
        working-directory: ios/LuvianoSkaner
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/LuvianoSkaner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee -a build.log | grep -E "error:|EXPORT|Upload" || true
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" build.log
          echo "Build ${{ github.run_number }} (${GITHUB_SHA::7}) wysłany — za ~10–20 min w TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Error summary
        if: failure()
        working-directory: ios/LuvianoSkaner
        run: |
          { echo '```'; grep -E "error:|Error" build.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "error:" build.log | head -40 | while read -r line; do echo "::error::$line"; done || true
