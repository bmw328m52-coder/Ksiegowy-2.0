name: iOS Skaner → TestFlight

# Buduje, podpisuje (certyfikat i profil zakładane przez klucz API App Store
# Connect, .github/scripts/asc_signing.py) i wysyła LUVIANO Skaner do TestFlight. Na iPadzie: apka TestFlight →
# Aktualizuj. Bez Sideloadly, bez 7-dniowego wygasania.
#
# Sekrety repo (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      — Key ID klucza API (App Store Connect → Users and Access → Integrations)
#   ASC_ISSUER_ID   — Issuer ID (ta sama strona, nad listą kluczy)
#   ASC_KEY_P8      — cała zawartość pliku AuthKey_XXXX.p8 (rola klucza: Admin)
#   APPLE_TEAM_ID   — Team ID (developer.apple.com → Account → Membership)
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml", ".github/scripts/asc_signing.py"]
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Sekrety ustawione?
        id: gate
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::Brak sekretów App Store Connect — pomijam TestFlight."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ok == 'true'

      # App Store Connect przyjmuje tylko buildy z iOS 26 SDK (Xcode 26+).
      - name: Xcode 26
        if: steps.gate.outputs.ok == 'true'
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Klucz API
        if: steps.gate.outputs.ok == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: XcodeGen
        if: steps.gate.outputs.ok == 'true'
        working-directory: ios/LuvianoSkaner
        run: |
          brew install xcodegen
          xcodegen generate


      - name: Archive
        if: steps.gate.outputs.ok == 'true'
        working-directory: ios/LuvianoSkaner
        run: |
          set -o pipefail
          # Numer builda rośnie z każdym uruchomieniem (TestFlight wymaga unikalnego).
          xcodebuild archive \
            -project LuvianoSkaner.xcodeproj \
            -scheme LuvianoSkaner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LuvianoSkaner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee build.log | grep -E "error:|ARCHIVE" || true
          test -d build/LuvianoSkaner.xcarchive/Products/Applications/LuvianoSkaner.app

      # Podpis dystrybucyjny robimy sami, nie przez -exportArchive: Xcode wpisuje
      # nazwę certyfikatu („…GUŻESKI”) do designated requirement w NFD, certyfikat
      # ma NFC → App Store Connect: „Invalid Signature”. Szczegóły w asc_signing.py.
      - name: Certyfikat i profil (API)
        if: steps.gate.outputs.ok == 'true'
        env:
          BUNDLE_ID: pl.luviano.skaner
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 -m venv /tmp/asc && /tmp/asc/bin/pip install -q pyjwt cryptography
          /tmp/asc/bin/python .github/scripts/asc_signing.py "$RUNNER_TEMP/sign"

      - name: Podpis i .ipa
        if: steps.gate.outputs.ok == 'true'
        working-directory: ios/LuvianoSkaner
        run: |
          set -eo pipefail
          S="$RUNNER_TEMP/sign"
          KC="$RUNNER_TEMP/ci.keychain-db"; PW=ci
          security create-keychain -p $PW "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p $PW "$KC"
          curl -fsSL -o "$S/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$S/wwdr.cer" -k "$KC" -T /usr/bin/codesign
          security import "$S/cert.p12" -k "$KC" -P ci -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $PW "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          SHA=$(cat "$S/cert_sha1")

          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/LuvianoSkaner.xcarchive/Products/Applications/LuvianoSkaner.app build/ipa/Payload/
          APP=build/ipa/Payload/LuvianoSkaner.app
          cp "$S/profile.mobileprovision" "$APP/embedded.mobileprovision"
          cat > "$S/ent.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>${APPLE_TEAM_ID}.pl.luviano.skaner</string>
            <key>com.apple.developer.team-identifier</key><string>${APPLE_TEAM_ID}</string>
            <key>get-task-allow</key><false/>
            <key>beta-reports-active</key><true/>
          </dict></plist>
          EOF
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 |
              xargs -0 -I{} codesign -f -s "$SHA" --keychain "$KC" {}
          fi
          codesign -f -s "$SHA" --keychain "$KC" \
            --entitlements "$S/ent.plist" --generate-entitlement-der \
            --requirements "$S/dr.txt" "$APP"

          codesign -dvv "$APP" 2>&1 | grep -E "Authority=Apple Distribution" | sed 's/^/::notice::podpis /' || true
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | sed 's/^/::notice::verify /'
          codesign --verify --deep --strict "$APP"
          (cd build/ipa && zip -qry ../LuvianoSkaner.ipa Payload)

      - name: Wysyłka do TestFlight
        if: steps.gate.outputs.ok == 'true'
        working-directory: ios/LuvianoSkaner
        run: |
          set -o pipefail
          xcrun altool --upload-app -f build/LuvianoSkaner.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee -a build.log
          grep -q "UPLOAD SUCCEEDED\|No errors uploading" build.log
          echo "Build ${{ github.run_number }} (${GITHUB_SHA::7}) wysłany — za ~10–20 min w TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Error summary
        if: failure()
        working-directory: ios/LuvianoSkaner
        run: |
          { echo '```'; grep -E "error:|Error" build.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "error:|ERROR" build.log | head -40 | while read -r line; do echo "::error::$line"; done || true
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
